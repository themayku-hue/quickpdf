<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पासपोर्ट फोटो मेकर</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f0f2f5; padding: 15px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #1e3a8a; text-align: center; margin-bottom: 20px; font-size: 22px; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #4f46e5; text-decoration: none; font-weight: bold; font-size: 14px; }
        
        .box { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 25px; text-align: center; background: #f8fafc; margin-bottom: 20px; }
        input[type="file"] { font-size: 15px; width: 100%; padding: 10px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; }
        
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; background: #f8fafc; min-height: 120px; }
        .img-card { position: relative; border: 1px solid #cbd5e1; padding: 6px; background: white; border-radius: 6px; text-align: center; }
        .img-card img { width: 100%; height: 140px; object-fit: cover; border: 3px solid #1e3a8a; border-radius: 2px; }
        .remove-btn { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        
        .btn-download { background: #0ea5e9; color: white; border: none; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">⬅ मुख्य मेनू पर वापस जाएं</a>
        <h1>पासपोर्ट साइज फोटो मेकर</h1>

        <div class="box">
            <p>अपनी कोई भी फोटो यहाँ अपलोड करें</p>
            <input type="file" id="passportInput" accept="image/*">
        </div>

        <canvas id="passportCanvas" style="display:none;"></canvas>

        <div>
            <p style="font-weight: bold; margin-bottom: 10px;">आपकी पासपोर्ट फोटो (3.5cm x 4.5cm):</p>
            <div id="previewGrid" class="preview-grid"></div>
        </div>

        <button id="downloadPassportBtn" class="btn-download">पासपोर्ट शीट का PDF डाउनलोड करें</button>
    </div>

    <script>
        let passportImages = [];
        const passportInput = document.getElementById('passportInput');
        const previewGrid = document.getElementById('previewGrid');
        const passportCanvas = document.getElementById('passportCanvas');

        passportInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const ctx = passportCanvas.getContext('2d');
                    // Strict Passport 3.5 : 4.5 dimension aspect crop ratio
                    const targetWidth = img.width;
                    const targetHeight = img.width * (4.5 / 3.5);
                    
                    passportCanvas.width = targetWidth;
                    passportCanvas.height = targetHeight;
                    
                    ctx.drawImage(img, 0, 0, img.width, Math.min(img.height, targetHeight), 0, 0, targetWidth, targetHeight);
                    
                    passportImages.push(passportCanvas.toDataURL('image/jpeg', 0.95));
                    renderPreviews();
                };
            };
            reader.readAsDataURL(file);
            passportInput.value = "";
        });

        function renderPreviews() {
            previewGrid.innerHTML = '';
            passportImages.forEach((src, index) => {
                const div = document.createElement('div');
                div.className = 'img-card';
                div.innerHTML = `<img src="${src}"><button class="remove-btn" onclick="deleteImg(${index})">X</button>`;
                previewGrid.appendChild(div);
            });
        }

        window.deleteImg = function(index) {
            passportImages.splice(index, 1);
            renderPreviews();
        };

        document.getElementById('downloadPassportBtn').addEventListener('click', () => {
            if (passportImages.length === 0) return alert("कृपया पहले फोटो चुनें!");
            const printWindow = window.open('', '_blank');
            printWindow.document.write('<html><head><style>body{padding:20px; text-align:center;} img{width:3.5cm; height:4.5cm; border:2px solid #000; object-fit:cover; display:inline-block; margin:10px; page-break-inside:avoid;}</style></head><body>');
            passportImages.forEach(src => printWindow.document.write(`<img src="${src}">`));
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => { printWindow.print(); printWindow.close(); }, 300);
        });
    </script>
</body>
</html>
